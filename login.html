<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – NovaTech</title>
  <meta name="description" content="Sign in to your NovaTech account to access AI-powered tools and cloud solutions."/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark:    #0f172a;
      --bg-card:    #1e293b;
      --bg-nav:     #111827;
      --accent:     #38bdf8;
      --accent-dark:#0ea5e9;
      --text-main:  #f1f5f9;
      --text-muted: #94a3b8;
      --border:     #334155;
      --error:      #f87171;
      --success:    #34d399;
    }

    body {
      font-family: 'Inter', Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Navbar ── */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 10%;
      background: var(--bg-nav);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 26px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
      text-decoration: none;
    }

    .nav-link {
      text-decoration: none;
      color: var(--text-muted);
      font-size: 14px;
      transition: color 0.3s;
    }

    .nav-link:hover { color: var(--accent); }

    /* ── Main wrapper ── */
    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      background: radial-gradient(ellipse at 60% 20%, rgba(56,189,248,0.08) 0%, transparent 60%),
                  linear-gradient(to bottom right, #0f172a, #1e293b);
    }

    /* ── Card ── */
    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 44px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(56,189,248,0.05);
      animation: slideUp 0.5s ease both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Card header ── */
    .card-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 20px rgba(56,189,248,0.3);
    }

    .card-icon svg {
      width: 28px;
      height: 28px;
      fill: white;
    }

    .card-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .card-sub {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 36px;
    }

    /* ── Form fields ── */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
      pointer-events: none;
      transition: fill 0.3s;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 13px 14px 13px 42px;
      background: #0f172a;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56,189,248,0.15);
    }

    input:focus + .focus-line { width: 100%; }

    /* Eye toggle for password */
    .eye-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: var(--text-muted);
      transition: color 0.3s, transform 0.3s;
      display: flex;
      align-items: center;
    }

    .eye-btn:hover { color: var(--accent); transform: translateY(-50%) scale(1.1); }
    .eye-btn svg { width: 18px; height: 18px; }

    /* ── Options row ── */
    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .remember input[type="checkbox"] {
      width: 16px;
      height: 16px;
      padding: 0;
      margin: 0;
      accent-color: var(--accent);
      border-radius: 4px;
    }

    .forgot-link {
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
      transition: color 0.3s;
    }

    .forgot-link:hover { color: var(--accent-dark); text-decoration: underline; }

    /* ── Submit button ── */
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 6px 20px rgba(56,189,248,0.35);
      letter-spacing: 0.3px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(56,189,248,0.45);
    }

    .btn-login:active { transform: translateY(0); }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 28px 0;
      color: var(--text-muted);
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Social buttons ── */
    .social-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
    }

    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 14px;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.3s, background 0.3s, transform 0.2s;
    }

    .btn-social:hover {
      border-color: var(--accent);
      background: rgba(56,189,248,0.06);
      transform: translateY(-1px);
    }

    .btn-social svg { width: 18px; height: 18px; }

    /* ── Sign up link ── */
    .signup-text {
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
    }

    .signup-text a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }

    .signup-text a:hover { color: var(--accent-dark); text-decoration: underline; }

    /* ── Error / Success message ── */
    .msg {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }

    .msg.error   { background: rgba(248,113,113,0.12); border: 1px solid var(--error);   color: var(--error);   display: flex; gap: 8px; }
    .msg.success { background: rgba(52,211,153,0.12);  border: 1px solid var(--success);  color: var(--success); display: flex; gap: 8px; }

    /* ── Footer ── */
    footer {
      background: #020617;
      text-align: center;
      padding: 18px;
      color: var(--text-muted);
      font-size: 13px;
      border-top: 1px solid var(--border);
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .login-card { padding: 36px 24px; }
      .social-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <a href="index.html" class="logo">NovaTech</a>
    <a href="index.html" class="nav-link">← Back to Home</a>
  </nav>

  <!-- Login Section -->
  <div class="login-wrapper">
    <div class="login-card">

      <!-- Icon -->
      <div class="card-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
        </svg>
      </div>

      <h1 class="card-title">Welcome back</h1>
      <p class="card-sub">Sign in to your NovaTech account</p>

      <!-- Error/Success message -->
      <div class="msg" id="form-msg" role="alert"></div>

      <!-- Form -->
      <form id="login-form" novalidate>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="eye-btn" id="eye-toggle" aria-label="Toggle password visibility">
              <!-- Eye open icon -->
              <svg id="eye-open" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
              <!-- Eye closed icon -->
              <svg id="eye-closed" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" style="display:none;">
                <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Options row -->
        <div class="options-row">
          <label class="remember">
            <input type="checkbox" id="remember" name="remember" />
            Remember me
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-login" id="login-btn">Sign In</button>
      </form>

      <!-- Divider -->
      <div class="divider">or continue with</div>

      <!-- Social logins -->
      <div class="social-row">
        <button class="btn-social" id="google-btn" type="button">
          <!-- Google icon -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google
        </button>

        <button class="btn-social" id="github-btn" type="button">
          <!-- GitHub icon -->
          <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          GitHub
        </button>
      </div>

      <p class="signup-text">
        Don't have an account? <a href="#">Create one free →</a>
      </p>

    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>© 2026 NovaTech. All Rights Reserved.</p>
  </footer>

  <script>
    /* ── Password toggle ── */
    const eyeBtn    = document.getElementById('eye-toggle');
    const pwdInput  = document.getElementById('password');
    const eyeOpen   = document.getElementById('eye-open');
    const eyeClosed = document.getElementById('eye-closed');

    eyeBtn.addEventListener('click', () => {
      const isHidden = pwdInput.type === 'password';
      pwdInput.type     = isHidden ? 'text' : 'password';
      eyeOpen.style.display   = isHidden ? 'none'  : '';
      eyeClosed.style.display = isHidden ? ''       : 'none';
    });

    /* ── Form validation & submission ── */
    const form    = document.getElementById('login-form');
    const loginBtn = document.getElementById('login-btn');
    const formMsg  = document.getElementById('form-msg');

    function showMsg(text, type) {
      formMsg.textContent = text;
      formMsg.className = 'msg ' + type;
    }

    function hideMsg() {
      formMsg.className = 'msg';
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      hideMsg();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      /* Basic validation */
      if (!email) {
        showMsg('⚠ Please enter your email address.', 'error');
        document.getElementById('email').focus();
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showMsg('⚠ Please enter a valid email address.', 'error');
        document.getElementById('email').focus();
        return;
      }

      if (!password || password.length < 6) {
        showMsg('⚠ Password must be at least 6 characters.', 'error');
        document.getElementById('password').focus();
        return;
      }

      /* Simulate login */
      loginBtn.textContent = 'Signing in…';
      loginBtn.disabled    = true;

      setTimeout(() => {
        loginBtn.textContent = 'Sign In';
        loginBtn.disabled    = false;
        showMsg('✓ Login successful! Redirecting…', 'success');
        // Replace with real redirect: window.location.href = '/dashboard';
      }, 1500);
    });

    /* ── Social button placeholder ── */
    document.getElementById('google-btn').addEventListener('click', () => {
      showMsg('Google login coming soon!', 'error');
    });
    document.getElementById('github-btn').addEventListener('click', () => {
      showMsg('GitHub login coming soon!', 'error');
    });
  </script>

</body>
</html>
